name: Check
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra gui
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not e2e and not resources"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv build
      - run: uv run python scripts/install_smoke.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --extra gui
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run design-workbench resources setup --config config.example.toml
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m 'e2e or resources'
