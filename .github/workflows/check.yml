name: Check
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra gui --extra ai --extra render
      - run: uv run --extra gui --extra ai --extra render ruff check .
      - run: uv run --extra gui --extra ai --extra render ruff format --check .
      - run: uv run --extra gui --extra ai --extra render mypy
      - run: uv run --extra gui --extra ai --extra render pytest -m "not e2e and not resources"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv build
      - run: uv run --extra gui --extra ai --extra render python scripts/install_smoke.py --extras gui,ai,render
  browser:
    runs-on: ubuntu-latest
    env:
      # The full browser supports pointer-lock input; headless shell emits warp deltas.
      DW_BROWSER_CHANNEL: chromium
      DW_TEST_VERSIONS: 1.20.1,1.21.4,26.1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --extra gui --extra ai --extra render
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run --extra gui --extra ai --extra render design-workbench resources setup --config config.example.toml
      - run: uv run --extra gui --extra ai --extra render design-workbench resources setup --minecraft-version 1.21.4 --config config.example.toml
      - run: uv run --extra gui --extra ai --extra render design-workbench resources setup --minecraft-version 26.1 --config config.example.toml
      - run: uv run --extra gui --extra ai --extra render playwright install --with-deps chromium
      - run: uv run --extra gui --extra ai --extra render pytest -m 'e2e or resources'
