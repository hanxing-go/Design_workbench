name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - name: Verify extracted ZIP
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/DesignWorkbench-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath artifacts/portable-extracted
          uv run python scripts/portable_smoke.py artifacts/portable-extracted/DesignWorkbench
      - uses: actions/upload-artifact@v4
        with:
          name: DesignWorkbench-windows-x64
          path: |
            dist/DesignWorkbench-*-windows-x64.zip
            dist/DesignWorkbench-*-windows-x64.zip.sha256
          if-no-files-found: error
