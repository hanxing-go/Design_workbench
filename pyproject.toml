[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minecraft-design-workbench"
version = "0.1.0"
description = "Independent Minecraft voxel design workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "platformdirs>=4.3,<5",
  "nbtlib>=2.0,<3",
]

[project.optional-dependencies]
gui = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pillow>=11,<13"]
render = ["playwright>=1.50,<2"]
ai = ["mcp>=1.20,<2"]

[project.scripts]
design-workbench = "design_workbench.interfaces.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "httpx>=0.28,<1",
  "build>=1.2,<2",
  "playwright>=1.50,<2",
  "types-Pillow>=10,<11",
  "litemapy==0.11.0b0",
  "mcp>=1.20,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/design_workbench"]
artifacts = ["src/design_workbench/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/design_workbench"]

[[tool.mypy.overrides]]
module = ["nbtlib", "nbtlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: real browser workflow", "resources: requires imported Minecraft resources"]
